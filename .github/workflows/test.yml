
name: Python tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q app scripts tests
      - run: pytest -q
      - run: node --input-type=module --check < app/static/main.js
      - run: node --input-type=module --check < app/static/map.js

  sumo-integration:
    runs-on: ubuntu-latest
    env:
      SUMO_HOME: /usr/share/sumo
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y sumo sumo-tools
      - run: pip install -e ".[dev,sumo]"
      - run: pytest -q tests/test_sumo_integration.py


  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build full Docker application and bundled Three.js
        run: docker build -f Dockerfile.sumo -t salaria-lab-ci .
      - name: Verify service starts offline and frontend assets are local
        run: |
          docker run --rm -d --name salaria-ci -e SALARIA_AUTO_SETUP=0 -p 127.0.0.1:18000:8000 salaria-lab-ci
          trap 'docker rm -f salaria-ci || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/health | grep '"ok":true'
          curl -fsSI http://127.0.0.1:18000/static/vendor/three.module.js
          curl -fsSI http://127.0.0.1:18000/static/vendor/leaflet/leaflet.js
          curl -fsSI http://127.0.0.1:18000/static/vendor/leaflet/leaflet.css
          curl -fsS http://127.0.0.1:18000/ | grep 'id="streetMap"'
          curl -fsS http://127.0.0.1:18000/ | grep 'id="runBtn"'
          curl -fsSI http://127.0.0.1:18000/static/vendor/addons/controls/OrbitControls.js
          curl -fsS http://127.0.0.1:18000/ | grep '/static/vendor/three.module.js'
          docker exec salaria-ci sh -c 'test -f "$SUMO_HOME/data/typemap/osmNetconvert.typ.xml"'

services:
  salaria-lab:
    build:
      context: .
      dockerfile: Dockerfile.sumo
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/service/data
    environment:
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      ROME_RESEARCH_MAX_WORKERS: ${ROME_RESEARCH_MAX_WORKERS:-4}
    restart: unless-stopped
